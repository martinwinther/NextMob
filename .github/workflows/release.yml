# Tag-triggered release to CurseForge (and Wago / WoWInterface if you add those
# tokens). Push an ANNOTATED tag named for the version and this does the rest:
#
#   git tag -a 1.0 -m "1.0"
#   git push origin 1.0
#
# The packager takes the version from the tag name, so the tag must be the
# version number and nothing else. Lightweight tags are ignored by the
# packager's changelog generation, hence -a.

name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write   # required, or the packager cannot create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, so the changelog can be generated

      # A tag is the only thing that publishes, so a tag pushed from a working
      # branch would put unreleased work on CurseForge. main is what has been
      # released; refuse anything that is not on it.
      - name: Refuse to publish a tag that is not on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit is on main."
          else
            echo "::error::$GITHUB_SHA is not on main, so it will not be published."
            echo "Merge the work into main first, then tag the merge commit."
            exit 1
          fi

      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4

      # The worst moment to discover something is broken is after the tag is
      # already pushed, so the same checks CI runs also gate the upload.
      - name: Validate the addon before shipping it
        run: |
          luac5.4 -p Core.lua QuestieDB.lua Button.lua Locale.lua
          lua5.4 tools/run-tests.lua .

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        with:
          # The packager's default label for an uploaded file is
          # "{project-version}{classic}{nolib}", which has no addon name in it,
          # so CurseForge shows a bare version number. -n takes
          # "{file name}:{upload label}" and uses the default for whichever
          # side is left blank, so this fixes the label and leaves the zip
          # name alone.
          args: -n ":{package-name}-{project-version}"
        env:
          # The packager's README and its wiki disagree on the name of the
          # CurseForge token variable, so both are set to the same secret.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          # Same situation for the GitHub token, used to attach the release.
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Leave unset and the packager skips these hosts.
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
